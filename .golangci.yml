version: "2"

run:
  timeout: 3m

linters:
  # Default set (standard): errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - noctx
    - errorlint
    - misspell
    - depguard
  settings:
    depguard:
      rules:
        # The API serves stored HTML; it must not link the markdown, chroma,
        # and YAML libraries that internal/content pulls in.
        read-side:
          files:
            - "**/cmd/api/**"
            - "**/internal/httpapi/**"
            - "**/internal/post/**"
          deny:
            - pkg: github.com/elmerred09/blog/internal/content
              desc: ingestion is blogctl-only; the API reads posts through internal/post

formatters:
  enable:
    - goimports # gofmt plus import grouping, matches organizeImports in the editor
