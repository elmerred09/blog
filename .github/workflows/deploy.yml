name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to build and deploy. Empty deploys the current main commit.
        required: false
        type: string

permissions:
  contents: read
  packages: write

# A deploy finishes even if another push lands while it is running.
# A workflow_run that is no longer the tip of main is skipped once it starts.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  current:
    name: Check this push is still the tip of main
    # branches above matches the CI head branch. A fork pull request from a
    # branch named main would otherwise check out that commit and start it here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      deploy: ${{ steps.tip.outputs.deploy }}
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check the commit
        run: |
          case "$DEPLOY_SHA" in
            *[!0-9a-fA-F]*) echo "DEPLOY_SHA must be a hex commit" >&2; exit 1 ;;
            "") echo "DEPLOY_SHA must be a hex commit" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Use the full commit
        id: sha
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_SHA=$sha" >> "$GITHUB_ENV"

      - name: Compare with the tip of main
        id: tip
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tip=$(git rev-parse refs/remotes/origin/main)
          if [ "$DEPLOY_SHA" = "$tip" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          echo "$DEPLOY_SHA is not the tip of main ($tip); skipping this deploy"

  deploy:
    needs: current
    if: needs.current.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ needs.current.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Require SITE_URL
        run: test -n "${{ vars.SITE_URL }}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          target: api
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/elmerred09/blog-api:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          target: migrate
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/elmerred09/blog-migrate:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: web
          file: deploy/docker/web.Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            SITE_INDEXING=false
          tags: ghcr.io/elmerred09/blog-web:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Copy the stack to the droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          ssh_opts="-i $HOME/.ssh/deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes"
          # shellcheck disable=SC2086
          ssh $ssh_opts "deploy@${DEPLOY_HOST}" "mkdir -p /srv/blog/db/init /srv/blog/certs"
          # shellcheck disable=SC2086
          scp $ssh_opts \
            deploy/prod/compose.yaml \
            deploy/prod/Caddyfile \
            deploy/prod/backup.sh \
            deploy/prod/blog-backup.service \
            deploy/prod/blog-backup.timer \
            "deploy@${DEPLOY_HOST}:/srv/blog/"
          # shellcheck disable=SC2086
          scp $ssh_opts db/init/01-extensions.sql "deploy@${DEPLOY_HOST}:/srv/blog/db/init/"
          # shellcheck disable=SC2086
          ssh $ssh_opts "deploy@${DEPLOY_HOST}" "chmod 755 /srv/blog/backup.sh"

      - name: Migrate and start
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/deploy" \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            "deploy@${DEPLOY_HOST}" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'
          set -euo pipefail
          cd /srv/blog
          printf 'IMAGE_TAG=%s\n' "$DEPLOY_SHA" > .env
          docker compose --profile tools pull
          # compose run keeps stdin open and would consume the rest of this
          # script, so the site would never be started.
          docker compose --profile tools run --rm migrate up </dev/null
          docker compose up -d
          # Compose strips one pair of quotes from an env file. Match that,
          # or curl rejects https://"example.dev"/ as a bad hostname.
          domain=$(sed -n 's/^DOMAIN=//p' caddy.env)
          domain=${domain%\"}
          domain=${domain#\"}
          domain=${domain%\'}
          domain=${domain#\'}
          test -n "$domain"
          curl -fsS --retry 5 --retry-connrefused --retry-delay 3 \
            -k --resolve "${domain}:443:127.0.0.1" \
            "https://${domain}/" >/dev/null
          echo "smoke ok"
          # In-use images stay. A rollback builds that SHA from GHCR again.
          docker image prune -af --filter "until=168h"
          EOF
