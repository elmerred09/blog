# Production stack. Run from /srv/blog, which also holds the env files, the
# origin certificate, and a .env that sets IMAGE_TAG to the commit SHA.
# The API, the site, and Postgres are not published. Caddy is the only
# public listener. Caddy and Postgres are pinned by digest so a pull cannot
# upgrade them. Change the tag and the digest together to upgrade.

name: blog

# Docker's default json-file driver never rotates, and Caddy logs every
# request. Cap each service; a daemon.json change would not travel with deploys.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    logging: *logging
    # The origin key is mode 600, owned by the deploy user. The image's
    # caddy user cannot read it. Root inside the container can.
    user: "0:0"
    env_file: ./caddy.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ghcr.io/elmerred09/blog-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    logging: *logging
    env_file: ./web.env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: ghcr.io/elmerred09/blog-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    logging: *logging
    env_file: ./api.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    logging: *logging
    env_file: ./postgres.env
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, on first init of an empty data volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot. `docker compose --profile tools run --rm migrate up`.
  # Not started by `docker compose up`.
  migrate:
    profiles: ["tools"]
    image: ghcr.io/elmerred09/blog-migrate:${IMAGE_TAG:?IMAGE_TAG is required}
    logging: *logging
    env_file: ./api.env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy-data:
  caddy-config:
