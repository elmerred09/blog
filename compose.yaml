# docker compose up -d postgres
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, on first init of an empty data volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      # pg_stat_statements must be preloaded; the extension itself is created in db/init.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local stand-in for Cloudflare R2. Only the loopback S3 port is published;
  # the console stays inside the container.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    # RUSTFS_ACCESS_KEY and RUSTFS_SECRET_KEY, shared with scripts/admin-keys.sh.
    env_file: deploy/rustfs/local.env
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      # scripts/admin-keys.sh points the API at this host port.
      - "127.0.0.1:9000:9000"
    volumes:
      - rustfsdata:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Applies deploy/rustfs once RustFS is up. Re-running replaces the policy
  # and CORS and leaves an existing bucket alone.
  rustfs-init:
    image: amazon/aws-cli:2.27.50
    depends_on:
      rustfs:
        condition: service_healthy
    # init.sh maps these to the AWS CLI's credential and region variables.
    env_file: deploy/rustfs/local.env
    environment:
      # RustFS does not implement the default CRC64 checksums of AWS CLI 2.23+.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./deploy/rustfs/init.sh:/init.sh:ro
      - ./deploy/rustfs/bucket-policy.json:/policy.json:ro
      - ./deploy/rustfs/cors.json:/cors.json:ro
    restart: "no"

volumes:
  pgdata:
  rustfsdata:
