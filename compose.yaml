# docker compose up -d postgres
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, on first init of an empty data volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      # pg_stat_statements must be preloaded; the extension itself is created in db/init.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
